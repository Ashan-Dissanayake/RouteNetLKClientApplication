name: Deploy RouteNetLK Frontend

on:
  push:
    branches:
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - .dockerignore
      - .github/**
  workflow_dispatch:

jobs:
  # ==========================================================
  # Build & Push Frontend Docker Image to Docker Hub
  # ==========================================================
  build-and-deploy:
    name: Build, Push & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Frontend Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/routenet-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/routenet-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========================================================
      # Deploy to AWS EC2 via SSH
      # ==========================================================
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/RouteNetLK
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"

            # Pull only updated frontend image
            docker compose pull frontend

            # Recreate frontend container without touching other services
            docker compose up -d --no-deps frontend

            # Remove old dangling images
            docker image prune -f
