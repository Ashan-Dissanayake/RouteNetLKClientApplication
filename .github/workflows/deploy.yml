  name: CI/CD Pipeline - RouteNetLK Frontend

  on:
    push:
      branches:
        - master
      paths-ignore:
        - '.gitignore'
        - 'README.md'
        - '.dockerignore'
        - '.github/**'
    workflow_dispatch:

  jobs:
    build-and-deploy:
      name: Build, Push & Deploy Frontend
      runs-on: ubuntu-latest
      timeout-minutes: 15

      # Required for GitHub OIDC -> AWS role assumption
      permissions:
        id-token: write
        contents: read

      steps:
        - name: Checkout Frontend Code
          uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Build & Push Frontend Image
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./Dockerfile
            push: true
            tags: |
              ${{ secrets.DOCKERHUB_USERNAME }}/routenet-frontend:latest
              ${{ secrets.DOCKERHUB_USERNAME }}/routenet-frontend:${{ github.sha }}
            cache-from: type=gha
            cache-to: type=gha,mode=max

        # Configure AWS credentials using GitHub OIDC
        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
            aws-region: ap-south-1

        # Deploy only the frontend service via AWS SSM
        - name: Deploy Frontend to AWS EC2 via SSM
          env:
            EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
            DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          shell: bash
          run: |
            set -euo pipefail

            if [[ -z "$EC2_INSTANCE_ID" || -z "$DOCKERHUB_USERNAME" ]]; then
              echo "Required deployment configuration is missing."
              exit 1
            fi

            PARAMETERS=$(jq -cn \
              --arg username "$DOCKERHUB_USERNAME" \
              '{
                commands: [
                  "set -e",
                  "cd /home/ubuntu/routenet-live",
                  ("export DOCKERHUB_USERNAME=" + ($username | @sh)),
                  "docker compose pull frontend",
                  "docker compose up -d --no-deps frontend",
                  "docker image prune -f"
                ]
              }')

            CMD_ID=$(aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy frontend ${GITHUB_SHA}" \
              --parameters "$PARAMETERS" \
              --query "Command.CommandId" \
              --output text)

            echo "SSM Command ID: $CMD_ID"

            WAITER_STATUS=0
            aws ssm wait command-executed \
              --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" || WAITER_STATUS=$?

            aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query '[Status,StandardOutputContent,StandardErrorContent]' \
              --output text

            if [[ "$WAITER_STATUS" -ne 0 ]]; then
              echo "Frontend deployment failed."
              exit 1
            fi

            echo "Frontend deployment completed successfully."
