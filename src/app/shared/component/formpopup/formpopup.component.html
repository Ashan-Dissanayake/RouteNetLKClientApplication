<mat-dialog-content *ngIf="data.form && data.meta">

  <h2 mat-dialog-title>{{ data.heading }}</h2>

  <form [formGroup]="data.form">
    <dynamic-field
      *ngFor="let field of data.meta"
      [formInstance]="data.form"
      [field]="field">
    </dynamic-field>
  </form>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <app-button-panel
    [buttons]="buttons"
    (actionClicked)="handleAction($event)">
  </app-button-panel>
</mat-dialog-actions>
