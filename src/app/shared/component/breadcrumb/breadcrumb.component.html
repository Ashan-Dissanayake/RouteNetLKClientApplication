<nav class="breadcrumb-container" aria-label="Breadcrumb" *ngIf="breadcrumbs().length > 0">
  <ol class="breadcrumb-list">
    <li class="breadcrumb-item">
      <a routerLink="/dashboard" class="breadcrumb-link">
        <span class="home-icon">🏠</span>
      </a>
    </li>
    <li *ngFor="let breadcrumb of breadcrumbs(); let last = last" class="breadcrumb-item" [class.active]="last">
      <span class="breadcrumb-separator">/</span>
      <a *ngIf="!last" [routerLink]="breadcrumb.url" class="breadcrumb-link">
        {{ breadcrumb.label | titlecase }}
      </a>
      <span *ngIf="last" class="breadcrumb-current">
        {{ breadcrumb.label | titlecase }}
      </span>
    </li>
  </ol>
</nav>
