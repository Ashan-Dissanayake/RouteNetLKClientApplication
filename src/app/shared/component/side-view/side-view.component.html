<!-- Dim overlay (closes on click) -->
<div class="side-overlay" *ngIf="opened" (click)="close()"></div>

<!-- Main container (table etc. stays in place) -->
<mat-drawer-container class="drawer-container">
  <mat-drawer-content>
    <ng-content></ng-content>
  </mat-drawer-content>
</mat-drawer-container>

<!-- Drawer rendered outside container to stay fixed -->
<mat-drawer
  class="side-view-drawer"
  [class.opened]="opened"
  mode="side"
  position="end"
  [opened]="opened">

  <div class="side-view-header">
    <h3>{{ title }}</h3>
    <button mat-icon-button (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="side-view-body" *ngIf="data">
    <ng-container *ngTemplateOutlet="viewTemplate; context: { $implicit: data }"></ng-container>
  </div>
</mat-drawer>
