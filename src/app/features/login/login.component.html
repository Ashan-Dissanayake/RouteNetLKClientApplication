<div class="login-container">
  <div class="glass-bg"></div>
  <mat-card class="login-card">
    <mat-progress-bar *ngIf="isLoading()" mode="indeterminate" class="login-progress"></mat-progress-bar>
    
    <mat-card-header class="login-header">
      <div class="logo-container">
        <mat-icon class="logo-icon">route</mat-icon>
      </div>
      <mat-card-title class="login-title">RouteNetLK</mat-card-title>
      <mat-card-subtitle class="login-subtitle">System Authentication</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="login-content">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" type="text" placeholder="Enter your username" autocomplete="username">
          <mat-icon matSuffix>person</mat-icon>
          <mat-error *ngIf="loginForm.get('username')?.hasError('required')">Username is required</mat-error>
          <mat-error *ngIf="loginForm.get('username')?.hasError('minlength')">Username must be at least 3 characters</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" [type]="hidePassword() ? 'password' : 'text'" placeholder="Enter your password" autocomplete="current-password">
          <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility()" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword()">
            <mat-icon>{{hidePassword() ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required</mat-error>
          <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">Password must be at least 4 characters</mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="login-button" [disabled]="isLoading() || loginForm.invalid">
          <span *ngIf="!isLoading()">Sign In</span>
          <span *ngIf="isLoading()">Authenticating...</span>
        </button>

      </form>
    </mat-card-content>
  </mat-card>
</div>
