<div class="container">
  <h2>Branch Management</h2>
</div>
  <!-- Summary Cards with mat-grid-list -->
  <app-stats-grid [stats]="stats"></app-stats-grid>

  <!-- Action Buttons -->
  <app-button-panel [buttons]="buttons" (actionClicked)="handleAction($event)"></app-button-panel>

<div *ngIf="searchForm && allDataLoaded" id="serverSearch">
  <form [formGroup]="searchForm">
    <dynamic-field
      *ngFor="let field of filterFormMeta"
      [formInstance]="searchForm"
      [field]="field">
    </dynamic-field>
  </form>

</div>




<div *ngIf="!showForm">
  <h1>Table View</h1>
</div>
