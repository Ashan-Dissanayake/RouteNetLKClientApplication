<div class="container">
  <h2>Branch Management</h2>
</div>
  <!-- Summary Cards with mat-grid-list -->
  <app-stats-grid [stats]="dashboardStatsMeta"></app-stats-grid>

  <!-- Action Buttons -->
<app-button-panel
  [buttons]="actionButtonsMeta"
  (actionClicked)="onActionPanelClick($event)"
  (dropdownClicked)="onDropdownOnlyClick($event)">
</app-button-panel>

<!-- Search Form -->
<div *ngIf="branchSearchForm && isInitialDataLoaded " id="serverSearch">
  <form [formGroup]="branchSearchForm">
    <dynamic-field
      *ngFor="let field of filterFormDefinition"
      [formInstance]="branchSearchForm"
      [field]="field"
    >
    </dynamic-field>
  </form>
</div>

<app-data-table
  [data]="branchList"
  [columns]="tableColumnsMeta"
  [sortable]="true"
  [paginatable]="true"
  [pageSizeOptions]="[5,10]"
  (rowClick)="onRowDataClick($event)"
  (actionClick)="onRowActionExecuted($event.action, $event.row)"
  (checkBoxClick)="onRowCheckboxChanged($event)"
  (selectAllClick)="onSelectAll($event)"
>
  <!-- Custom actions column -->
  <ng-template tableCell="actions" let-row let-action="action">
    <button mat-button (click)="action('edit', row); $event.stopPropagation()">Edit</button>
  </ng-template>
</app-data-table>
