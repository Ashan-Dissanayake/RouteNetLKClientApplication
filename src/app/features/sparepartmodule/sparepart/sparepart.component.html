<!-- Loading -->
<mat-progress-bar
  *ngIf="loading$ | async"
  mode="indeterminate">
</mat-progress-bar>


<!-- Error -->
<div
  *ngIf="error$ | async as error"
  id="error-window">

  <mat-card>
    <mat-card-title>
      Error loading parts
    </mat-card-title>

    <mat-card-content>
      <mat-card-content>{{ error ? error : 'An unknown error occurred.' }}</mat-card-content>
    </mat-card-content>

    <button
      mat-raised-button
      color="primary"
      (click)="reload()">
      Retry
    </button>
  </mat-card>

</div>


<!-- Main Content -->
<ng-container *ngIf="!(error$ | async)">

  <!-- Action Panel -->
  <app-button-panel
    [buttons]="config.actionPanel"
    (actionClicked)="onActionTriggered($event)"
    (dropdownClicked)="onDropdownOnlyClick($event)"
    [contextData]="{ selectedRows: selectedRows }">
  </app-button-panel>


  <!-- Filter -->
  <div id="serverSearch">
    <form [formGroup]="filterForm">

      <dynamic-field
        *ngFor="
          let field of config.filterFormMeta;
          trackBy: trackByField
        "
        [formInstance]="filterForm"
        [field]="field">
      </dynamic-field>

    </form>
  </div>


  <!-- Table -->
  <app-side-view
    [opened]="activeRow !== null"
    [data]="activeRow"
    [title]="'Part Details'"
    (closed)="onCloseDetailView()">

    <app-data-table
      [loading]="(loading$ | async) || false"
      [data]="(items$ | async) || []"
      [columns]="config.tableColumns"
      [sortable]="true"
      [paginatable]="true"
      [pageSizeOptions]="[10, 20]"
      (rowClick)="onRowClick($event)"
      (checkBoxClick)="onRowCheckboxChanged($event)"
      (selectAllClick)="onSelectAll($event)"
      (actionClick)="onRowAction($event.action, $event.row)">

      <ng-template
        tableCell="actions"
        let-row
        let-action="action">

        <button
          mat-button
          (click)="action('edit', row); $event.stopPropagation()">

          <mat-icon>mode_edit</mat-icon>

        </button>

      </ng-template>

    </app-data-table>

  </app-side-view>

</ng-container>
