
<div class="container">
  <h2>Conductor Details Management</h2>
</div>

<!-- ===== Action Panel ===== -->
<app-button-panel
  [buttons]="actionPanelConfig"
  (actionClicked)="onActionTriggered($event)"
  (dropdownClicked)="onDropdownOnlyClick($event)"
  [contextData]="{ selectedRows: this.selectedRows }"
>
</app-button-panel>

<!-- ===== Filter Section ===== -->
<div *ngIf="filterForm && dataInitialized" id="serverSearch">
  <form [formGroup]="filterForm">
    <dynamic-field
      *ngFor="let field of filterFormMeta"
      [formInstance]="filterForm"
      [field]="field"
    >
    </dynamic-field>
  </form>
</div>

<app-side-view
  [opened]="activeRow !== null"
  [data]="activeRow"
  [title]="'Conductor Details'"
  (closed)="onCloseDetailView()"
  [viewTemplate]="conductorDetailTemplate"
>
  <app-data-table
    tableClass="conductor-table"
    [data]="conductors"
    [columns]="tableColumns"
    [sortable]="true"
    [paginatable]="true"
    [pageSizeOptions]="[10, 20]"
    (rowClick)="onRowClick($event)"
    (actionClick)="onRowAction($event.action, $event.row)"
    (checkBoxClick)="onRowCheckboxChanged($event)"
    (selectAllClick)="onSelectAll($event)"
  >
    <!-- Row Actions -->
    <ng-template tableCell="actions" let-row let-action="action">
      <button mat-button (click)="action('edit', row); $event.stopPropagation()">
        <mat-icon>mode_edit</mat-icon>
      </button>
    </ng-template>
  </app-data-table>
</app-side-view>

<ng-template #conductorDetailTemplate let-row>
  <div  class="conductor-detail-container">
    <!-- Header -->
    <div class="header">
      <div class="title-section">
        <mat-icon color="primary" class="conductor-icon">people</mat-icon>
        <div>
          <h2 class="conductor-title">{{ row.employee.callingname }}</h2>
          <p class="conductor-subtitle">Number: {{ row.number }}</p>
        </div>
      </div>

      <span
        class="status-chip"
        [ngClass]="{
        'eligible': row.crewstatus.name === 'Eligible',
        'ineligible': row.crewstatus.name === 'Ineligible',
        'active': row.crewstatus.name === 'Active',
        'inactive': row.crewstatus.name === 'Inactive'
      }">
      {{ row.crewstatus.name }}
      </span>
    </div>

    <mat-divider></mat-divider>
    <!-- General Info -->
    <div class="info-grid">
      <div class="info-item">
        <span class="label">Route Familiarity Level</span>
        <span class="value">{{ row.routefamiliaritylevel.name || '-' }}</span>
      </div>
      <div class="info-item">
        <span class="label">Medical Expiring Date</span>
        <span class="value">{{ row.domedicalexpired || '-' }}</span>
      </div>

    </div>
    <mat-divider></mat-divider>
  </div>

</ng-template>
