<mat-card class="report-card">
  <mat-card-header class="report-header">

      <mat-card-title>Fleet Dispatch vs. Breakdown Impact</mat-card-title>
      <mat-card-subtitle>Correlating operational trip volume with active mid-route breakdown incidents</mat-card-subtitle>
    </div>
    <div class="report-actions">
      <span class="metric-badge">System Status: Stable</span>
    </div>
  </mat-card-header>

  <mat-card-content class="chart-content-pane">
    <div class="canvas-container">
      <canvas #dimensionsChart></canvas>
    </div>
  </mat-card-content>

  <mat-divider></mat-divider>
